[package]
name = "e2e-linux"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
rat-types = { path = "../../crates/rat-types" }
rat-core = { path = "../../crates/rat-core" }
rat-monitor-linux = { path = "../../crates/rat-monitor-linux" }
rat-enforcer = { path = "../../crates/rat-enforcer" }
rat-daemon = { path = "../../crates/rat-daemon" }
tokio = { version = "1.0", features = ["full"] }
nix = { version = "0.29.0", features = ["sched", "user", "net", "process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }

[[bin]]
name = "e2e-linux"
path = "src/main.rs"

[[bin]]
name = "test-client"
path = "src/test_client.rs"
