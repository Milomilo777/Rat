[package]
name = "rat-enforcer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rat-enforcer = { path = "../crates/rat-enforcer" }

[features]
default = []

[[bin]]
name = "validate_path"
path = "fuzz_targets/validate_path.rs"
test = false
doc = false
