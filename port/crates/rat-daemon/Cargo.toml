[package]
name = "rat-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
rat-types = { path = "../rat-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Security_Authorization", "Win32_Security", "Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemServices"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
criterion = "0.5.1"
proptest = "1.12.0"

[[bench]]
name = "ipc_bench"
harness = false
