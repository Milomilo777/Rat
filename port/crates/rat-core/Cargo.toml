[package]
name = "rat-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rat-types = { path = "../rat-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
