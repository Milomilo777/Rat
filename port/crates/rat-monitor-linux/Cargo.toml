[package]
name = "rat-monitor-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rat-types = { path = "../rat-types" }
serde = { version = "1", features = ["derive"] }
hex = "0.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = "0.9.0"
netlink-packet-core = "0.9.0"
netlink-packet-sock-diag = "0.5.0"
libc = "0.2.169"

[dev-dependencies]
tempfile = "3"
