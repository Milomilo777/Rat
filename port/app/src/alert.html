<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connection Alert</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        --bg-color: #f0f0f0;
        --text-color: #111111;
        --panel-bg: #ffffff;
        --border-color: #cccccc;
        --accent-color: #2563eb;
        --input-bg: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #1e1e1e;
          --text-color: rgba(255, 255, 255, 0.87);
          --panel-bg: #252526;
          --border-color: #333333;
          --accent-color: #4ade80;
          --input-bg: #333333;
        }
      }

      body {
        background: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
      }

      :focus {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }

      .alert-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .header h2 { margin: 0; font-size: 1.2rem; color: #f87171; }
      .details { background: var(--panel-bg); padding: 15px; border-radius: 6px; }
      .actions { display: flex; gap: 10px; margin-top: 10px; }
      button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; }
      .btn-allow { background: #4ade80; color: #000; }
      .btn-deny { background: #f87171; color: #000; }
      .options { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
      select { background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 5px; border-radius: 4px; font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="app" class="alert-container">
    </div>

    <script type="module">
      import { t, setLocale, getLocale } from './i18n.ts';

      const urlParams = new URLSearchParams(window.location.search);
      const lang = urlParams.get('lang');
      if (lang) {
          setLocale(lang);
      }

      if (getLocale() === 'ar-PSEUDO') {
          document.documentElement.dir = 'rtl';
      } else {
          document.documentElement.dir = 'ltr';
      }

      document.title = t('alert_title');

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="header">
          <h2 tabindex="0">${t('alert_blocked')}</h2>
          <p tabindex="0">${t('alert_wants_to_connect', { app: '<strong>Firefox</strong>', ip: '<bdi><strong>1.1.1.1</strong></bdi>', port: '<bdi>443</bdi>' })}</p>
        </div>

        <div class="options">
          <label>
            ${t('scope')}
            <select id="scope" tabindex="0">
              <option value="any">${t('any_connection')}</option>
              <option value="domain">${t('this_domain')}</option>
              <option value="ip">${t('this_ip')}</option>
              <option value="port">${t('this_port')}</option>
            </select>
          </label>
          <label>
            ${t('timeout')}
            <select id="timeout" tabindex="0">
              <option value="forever">${t('forever')}</option>
              <option value="until-quit">${t('until_quit')}</option>
              <option value="5m">${t('five_minutes')}</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button class="btn-allow" tabindex="0" onclick="window.close()">${t('btn_allow')}</button>
          <button class="btn-deny" tabindex="0" onclick="window.close()">${t('btn_deny')}</button>
        </div>
      `;

      document.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
              const active = document.activeElement;
              if (active && typeof active.click === 'function') {
                  active.click();
              }
          }
      });
    </script>
  </body>
</html>
