name: Port E2E Linux

on:
  push:
    branches:
      - jules-port-e2e-linux

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify tools
        run: |
          rustc --version
          cargo --version
          nft -v || true
          sudo nft list ruleset || true

      - name: Run E2E Tests
        run: |
          cd port/e2e/linux
          sudo cargo run
