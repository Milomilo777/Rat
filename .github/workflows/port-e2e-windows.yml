name: Port E2E Windows
on:
  push:
    branches:
      - '**'

jobs:
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Build rat-daemon
        working-directory: port
        run: cargo build -p rat-daemon --release
      - name: Run E2E Tests
        working-directory: port/e2e/windows
        run: cargo run --release
      - name: Verify host firewall has no rat leftovers
        if: always()
        run: |
          $rules = Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object {$_.DisplayName -like 'Rat:path:*'}
          if ($rules) {
            Write-Error "Host firewall has rat leftovers!"
            $rules | Select-Object DisplayName
            throw "Firewall leftover error"
          }
